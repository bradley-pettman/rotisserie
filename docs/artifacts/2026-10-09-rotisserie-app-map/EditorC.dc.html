<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe editor C: type a line, get chips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#222222}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #6f6f6f; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; color: #222222">
<div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow: hidden; background: #ffffff; border-radius: 16px 16px 0 0">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #ececec">
<a href="#" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; color: #222222">Cancel</a>
<h1 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">New recipe</h1>
<a href="#" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #222222">Save</a>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 16px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-name" style="font-size: 13px; color: #555555">Name</label>
<input id="c-name" value="Turkey Chili" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 17px">
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-makes" style="font-size: 13px; color: #555555">Makes</label><input id="c-makes" value="4" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-prep" style="font-size: 13px; color: #555555">Prep, min</label><input id="c-prep" value="15" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-cook" style="font-size: 13px; color: #555555">Cook, min</label><input id="c-cook" value="60" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 2px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">INGREDIENTS</h2>

<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left">
<span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">1 lb</span>
<span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">ground turkey</span>
</button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left">
<span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">1</span>
<span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">onion</span>
<span style="font-size: 14px; color: #6b6b6b">diced</span>
</button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left">
<span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">2 cloves</span>
<span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">garlic</span>
<span style="font-size: 14px; color: #6b6b6b">minced</span>
</button>

<div style="display: flex; flex-direction: column; gap: 6px">
<input aria-label="New ingredient line" value="2 tbsp chili pow" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 2px solid #222222; border-radius: 10px; font: inherit; font-size: 16px">
<div role="listbox" aria-label="Ingredient suggestions" style="display: flex; flex-direction: column; border: 1px solid #d0d0d0; border-radius: 10px; background: #ffffff; box-shadow: 0 6px 16px rgba(0,0,0,0.12); overflow: hidden">
<button role="option" style="min-height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid #ececec; background: #ffffff; font: inherit; font-size: 15px; text-align: left; color: #222222">2 tbsp <b>chili pow</b>der</button>
<button role="option" style="min-height: 44px; padding: 0 12px; border: 0; background: #ffffff; font: inherit; font-size: 15px; text-align: left; color: #222222">2 tbsp <b>chili pow</b>der, ancho</button>
</div>
<span style="font-size: 12px; color: #6b6b6b">Return adds the next line. Tap a line to edit its text.</span>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
