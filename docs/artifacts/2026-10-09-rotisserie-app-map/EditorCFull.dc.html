<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe editor C: whole form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#222222}a:hover{color:#000000}
input::placeholder,textarea::placeholder{color:#8a8a8a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1480px; overflow: hidden; background: #6f6f6f; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; color: #222222">
<div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow: hidden; background: #ffffff; border-radius: 16px 16px 0 0">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #ececec">
<a href="#" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; color: #222222">Cancel</a>
<h1 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">New recipe</h1>
<a href="#" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #222222">Save</a>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 16px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-name" style="font-size: 13px; color: #555555">Name</label>
<input id="f-name" value="Turkey Chili" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 17px">
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-makes" style="font-size: 13px; color: #555555">Makes</label><input id="f-makes" value="4" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-prep" style="font-size: 13px; color: #555555">Prep, min</label><input id="f-prep" value="15" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-cook" style="font-size: 13px; color: #555555">Cook, min</label><input id="f-cook" value="60" inputmode="numeric" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 16px"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 2px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">INGREDIENTS</h2>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left"><span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">1 lb</span><span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">ground turkey</span></button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left"><span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">1</span><span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">onion</span><span style="font-size: 14px; color: #6b6b6b">diced</span></button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left"><span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">2 cloves</span><span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">garlic</span><span style="font-size: 14px; color: #6b6b6b">minced</span></button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left"><span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">2 tbsp</span><span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">chili powder</span></button>
<button style="min-height: 48px; padding: 6px 10px; border: 1px solid #e2e2e2; border-radius: 10px; background: #ffffff; font: inherit; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left"><span style="padding: 2px 10px; border-radius: 12px; background: #222222; color: #ffffff; font-size: 14px; font-weight: 600">1 can</span><span style="padding: 2px 10px; border-radius: 12px; background: #efefef; font-size: 14px; color: #222222">kidney beans</span><span style="font-size: 14px; color: #6b6b6b">15 oz, drained</span></button>
<input aria-label="New ingredient line" placeholder="Add an ingredient, or paste a list" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1.5px dashed #b5b5b5; border-radius: 10px; font: inherit; font-size: 15px">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-instructions" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">INSTRUCTIONS</label>
<textarea id="f-instructions" style="height: 168px; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 15px; line-height: 22px; resize: none">1. Brown the turkey with the onion in a large pot, about 8 minutes.
2. Stir in the garlic and chili powder and cook 1 minute.
3. Add the tomatoes, beans and stock. Simmer 45 minutes, stirring now and then.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">TAGS</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 2px; padding-left: 12px; border-radius: 18px; background: #efefef; font-size: 14px">weeknight<button aria-label="Remove weeknight" style="width: 36px; height: 36px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #555555">×</button></span>
<span style="display: inline-flex; align-items: center; gap: 2px; padding-left: 12px; border-radius: 18px; background: #efefef; font-size: 14px">freezer-friendly<button aria-label="Remove freezer-friendly" style="width: 36px; height: 36px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #555555">×</button></span>
</div>
<input aria-label="Add a tag" value="spi" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #222222; border-radius: 10px; font: inherit; font-size: 15px">
<div role="listbox" aria-label="Tag suggestions" style="display: flex; flex-wrap: wrap; gap: 8px">
<button role="option" style="min-height: 36px; padding: 0 12px; border: 1.5px solid #222222; border-radius: 18px; background: #ffffff; font: inherit; font-size: 14px; color: #222222">+ <b>spi</b>cy</button>
<button role="option" style="min-height: 36px; padding: 0 12px; border: 1.5px dashed #b5b5b5; border-radius: 18px; background: #ffffff; font: inherit; font-size: 14px; color: #555555">+ new tag "spi"</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-website" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">WEBSITE</label>
<input id="f-website" type="url" inputmode="url" placeholder="https://" value="https://www.seriouseats.com/turkey-chili" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 15px">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-notes" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #6b6b6b">NOTES</label>
<textarea id="f-notes" placeholder="Swaps, what the kids think, what to change next time" style="height: 88px; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #d0d0d0; border-radius: 10px; font: inherit; font-size: 15px; resize: none"></textarea>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
