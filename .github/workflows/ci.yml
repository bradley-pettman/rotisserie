name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Format, typecheck and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rotisserie_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Synthesize infrastructure
        run: npm run synth -w @rotisserie/infra

  migrations:
    name: Migrations apply, seed and roll back
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rotisserie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rotisserie_dev?sslmode=disable
      DBMATE_VERSION: '2.36.0'
      DBMATE_SHA256: '47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/v${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        run: dbmate --wait --no-dump-schema up

      - name: Load seed data
        run: npm run db:seed

      - name: Roll back and re-apply
        run: |
          while [ -n "$(dbmate --no-dump-schema status | grep '^\[X\]')" ]; do
            dbmate --no-dump-schema rollback
          done
          dbmate --no-dump-schema up

  deploy:
    name: Deploy to production
    needs: [verify, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: npm run deploy -w @rotisserie/infra -- --parameters "AlertEmail=$ALERT_EMAIL"

  app:
    name: Publish the app
    needs: deploy
    runs-on: ubuntu-latest

    concurrency:
      group: app-production
      cancel-in-progress: false

    defaults:
      run:
        working-directory: apps/mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://api.rotisserieapp.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check for a version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./app.json').expo.version")
          previous=""
          if git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            previous=$(git show "$BEFORE:apps/mobile/app.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).expo.version")
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish an over-the-air update
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel production --environment production --message "$(printf '%s' "$MESSAGE" | head -n 1)" --non-interactive

      - name: Start production builds
        if: steps.version.outputs.changed == 'true'
        run: eas build --profile production --platform android --non-interactive --no-wait
