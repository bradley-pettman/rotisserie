name: CI

on:
  pull_request:
  push:
    branches: [main]

# TODO: E2E (Playwright, `npm run test`) is deliberately NOT wired up here yet.
# It needs a Postgres service, `dbmate up`, `npm run db:seed`, and a running dev
# server on :5173 — that is a separate piece of work from this unit/typecheck CI.

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
