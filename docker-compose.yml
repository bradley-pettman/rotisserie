services:
  db:
    image: postgres:16
    container_name: rotisserie_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rotisserie_dev
    ports:
      # Bound to loopback ON PURPOSE. Docker's default ("5432:5432") publishes
      # on 0.0.0.0 AND installs an iptables DNAT rule that bypasses a host
      # ufw/firewalld policy -- so on a laptop this database is reachable from
      # the LAN, and on any cloud dev box or shared runner it is reachable from
      # the internet, with the credentials two lines above. The app, dbmate and
      # the test suite all connect from the host, so loopback is all they need.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
