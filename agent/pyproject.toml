[project]
name = "rotisserie-agent"
version = "0.1.0"
description = "Meal-planning agent service for Rotisserie. Reads and writes exclusively through the TypeScript JSON API; it never touches Postgres."
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.7.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotisserie_agent"]
